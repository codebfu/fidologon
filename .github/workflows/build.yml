name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# Third-party actions are pinned by commit SHA (a tag can be moved); Dependabot keeps them current.
jobs:
  # Builds and tests with the vcpkg binary cache. Never sees the signing secrets.
  build:
    runs-on: windows-2025
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\..\vcpkg-cache
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            $version = "0.0.0-ci.${{ github.run_number }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Fetch vcpkg at the manifest baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content native/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git init $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT fetch --depth 1 https://github.com/microsoft/vcpkg $baseline
          git -C $env:VCPKG_ROOT checkout FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-windows-static-${{ hashFiles('native/vcpkg.json') }}

      - name: Build, test and package (unsigned)
        shell: pwsh
        run: ./scripts/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fidologon-${{ steps.version.outputs.version }}${{ startsWith(github.ref, 'refs/tags/v') && '-unsigned' || '' }}
          path: artifacts/*
          if-no-files-found: error

      - name: Upload staging folder for signing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging
          path: build/staging/
          if-no-files-found: error
          retention-days: 1

  # Signs and packages the staged files. Restores no cache and builds no code; the signing
  # secrets only exist in the protected release-signing environment (tags v*.*.*, approval).
  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging
          path: staging

      - name: Import signing certificate
        id: certificate
        shell: pwsh
        env:
          FIDOLOGON_SIGNING_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          FIDOLOGON_SIGNING_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $thumbprint = ./scripts/import-signing-certificate.ps1
          "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT

      - name: Sign and package
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version "${{ needs.build.outputs.version }}" -StagingDir staging `
            -CertificateThumbprint "${{ steps.certificate.outputs.thumbprint }}"

      - name: Remove signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: ./scripts/import-signing-certificate.ps1 -RemoveThumbprint "${{ steps.certificate.outputs.thumbprint }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fidologon-${{ needs.build.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fidologon-${{ needs.build.outputs.version }}
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cp certs/FidoLogon-CodeSigning.cer release/
          cp scripts/trust-certificate.ps1 release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "FidoLogon $VERSION" \
            --generate-notes \
            $prerelease
